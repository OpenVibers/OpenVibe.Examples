name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # install, node --check, tests, contract and pin-drift checks: the shared test job (WS-Q task 1).
  test:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/test.yml@66b76f868ea8228aad7811309eafef3726b036f3
    with:
      install: npm ci                 # one install for every example (npm workspaces)
      test: npm test                  # every example's tests
      syntax-dirs: scripts
      extra: npm run developer-path:mock   # the developer path end to end against mocks
  # Secret scan (gitleaks) and dependency audit, shared by every OpenVibers repo.
  # The examples are what a developer copies, on whatever OS they use (owner, 2026-10-27: "the shared SDK and API … work
  # well across multi-platform"): every example's tests and the developer path, on Windows and macOS too.
  other-os:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          OV_ALLOW_SUITE: '1'
      - run: npm run developer-path:mock
  security:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/security.yml@66b76f868ea8228aad7811309eafef3726b036f3
