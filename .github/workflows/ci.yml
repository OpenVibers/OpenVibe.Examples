name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1   # the Node version the platform's services run
      - run: npm ci             # one install for every example (npm workspaces)
      # Every example's smoke test runs against openvibe-sdk/testing's mock platform and small local
      # mocks (Chat WebSocket, Tools jobs). No test reaches the network or a real service.
      - run: npm test
